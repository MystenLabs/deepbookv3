[package]
name = "propbook"
edition = "2024.beta"
version = "0.0.1"

# No `[addresses]` block: it makes the manifest "old-style", which cannot depend
# on the new-style `pyth_lazer` package. The named address `propbook` is
# auto-managed from the package name (matching `packages/predict`).

[dependencies]
fixed_math = { local = "../fixed_math" }
# Official Pyth Lazer Sui package. Used by `propbook::pyth_feed::update`
# to consume a verified `pyth_lazer::update::Update`. The `Update` constructor is
# package-scoped, so the Move type system enforces "this value came from Pyth's
# verifier." Legacy Testnet source/publication provenance: vendor/pyth_lazer/README.md.
pyth_lazer = { local = "../../vendor/pyth_lazer" }
# Block Scholes signed-oracle verifier and canonical SID derivation.
# `bs_oracle::verify` mints the authenticated batch types; `bs_sid` derives the
# exact feed identities each asset-bound store accepts. Both dependencies share
# one pinned upstream revision whose `Published.toml` files own their testnet
# package identities.
bs_oracle = { git = "https://github.com/blockscholes/sui-signed-oracle.git", subdir = "move/bs_oracle", rev = "83bfec450540068a27277b40babcb6fbb26c7e11" }
bs_sid = { git = "https://github.com/blockscholes/sui-signed-oracle.git", subdir = "move/bs_sid", rev = "83bfec450540068a27277b40babcb6fbb26c7e11" }

[dep-replacements.mainnet]
# Pyth's publication record selects v2 while preserving the original type identity.
pyth_lazer = { local = "../../vendor/pyth_lazer_mainnet" }
bs_oracle = { git = "https://github.com/blockscholes/sui-signed-oracle.git", subdir = "move/bs_oracle", rev = "3836e65711bd61e8ee5625a45fb4364f3ec70193" }
bs_sid = { git = "https://github.com/blockscholes/sui-signed-oracle.git", subdir = "move/bs_sid", rev = "3836e65711bd61e8ee5625a45fb4364f3ec70193" }
