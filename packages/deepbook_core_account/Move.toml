[package]
name = "deepbook_core_account"
edition = "2024.beta"
version = "0.0.1"

[dependencies]
account = { local = "../account" }
deepbook = { local = "../deepbook" }
token = { local = "../token" }

[dep-replacements.mainnet]
deepbook = { git = "https://github.com/MystenLabs/deepbookv3.git", subdir = "packages/deepbook", rev = "2f83e49f21c3aaf96b779f24be0fd6951bc75b29" }
token = { local = "../../vendor/deep", override = true }

[dep-replacements.testnet]
deepbook = { git = "https://github.com/MystenLabs/deepbookv3.git", subdir = "packages/deepbook", rev = "ce0e5cd052d7d1eb195bb486396730c550f8f92a" }
token = { local = "../../vendor/deep", override = true }
