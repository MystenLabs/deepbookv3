[dep-replacements.testnet]
deepbook = { git = "https://github.com/MystenLabs/deepbookv3.git", subdir = "packages/deepbook", rev = "90a64c4933d909857a3acd70928639171b6cf17e" }
token = { local = "../../vendor/deep", override = true }
