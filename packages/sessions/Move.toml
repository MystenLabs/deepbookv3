[package]
name = "deepbook_sessions"
edition = "2024.beta"
version = "0.0.1"

[dependencies]
account = { local = "../account" }
deepbook_predict = { local = "../predict" }
deepbook_core_account = { local = "../deepbook_core_account" }
deepbook = { local = "../deepbook" }
propbook = { local = "../propbook" }
fixed_math = { local = "../fixed_math" }
usdc = { local = "../usdc" }
# Sessions and the spot wrapper share DeepBook's in-repository token dependency.
token = { local = "../token" }
# This publishable root shares Predict's vendored Testnet Pyth source and
# declares the Mainnet replacement for the transitive Pyth/Wormhole graph.
pyth_lazer = { local = "../../vendor/pyth_lazer" }
# The production-valid oracle fixture mints verifier-authenticated test batches.
bs_oracle = { git = "https://github.com/blockscholes/sui-signed-oracle.git", subdir = "move/bs_oracle", rev = "83bfec450540068a27277b40babcb6fbb26c7e11" }

[dep-replacements.mainnet]
usdc = { git = "https://github.com/circlefin/stablecoin-sui.git", subdir = "packages/usdc", rev = "23fff2ed82a7fdc26e408a56553b1e1d0ba7b06f" }
pyth_lazer = { local = "../../vendor/pyth_lazer_mainnet" }
bs_oracle = { git = "https://github.com/blockscholes/sui-signed-oracle.git", subdir = "move/bs_oracle", rev = "3836e65711bd61e8ee5625a45fb4364f3ec70193" }
