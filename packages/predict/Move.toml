[package]
name = "deepbook_predict"
edition = "2024.beta"
version = "0.0.1"

[dependencies]
fixed_math = { local = "../fixed_math" }
dusdc = { local = "../dusdc" }
# Reusable on-chain account primitive. Predict's per-account custody (`Account.vault`)
# and its app-data slot live here; the former PredictManager / cap / proof layer
# collapses onto it. Declared `local` like the other in-repo packages.
account = { local = "../account" }
# Standalone Pyth + split Block Scholes oracle feeds. Predict consumes
# `propbook::pyth_feed` plus the BS spot/forward/SVI feeds for live pricing (the
# former in-package `market_oracle`/`pyth_source` modules were extracted into
# propbook).
propbook = { local = "../propbook" }
# DEEP token, used for staking custody (`registry::stake_deep`) and DEEP burning
# via `token::deep::ProtectedTreasury`. Its committed publication metadata links
# this local source to the existing network package.
token = { local = "../token" }
# Official Pyth Lazer Sui package — now a transitive dependency through `propbook`
# (which consumes the verified `pyth_lazer::update::Update`). Kept as a direct dep
# so the publishable root declares the `dep-replacements` linking below. Pinned
# to the exact source used by the testnet deployment.
pyth_lazer = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "lazer/contracts/sui", rev = "f80ff8b1aa2aa9ca17530a9b6294d254f938a5bf" }
# Block Scholes signed-oracle verifier. Predict source does not use it directly —
# BS data is read through propbook's stores — but test fixtures mint verified
# batches through it to seed those stores. Same pin propbook declares; upstream
# `Published.toml` owns its testnet package identity.
bs_oracle = { git = "https://github.com/blockscholes/sui-signed-oracle.git", subdir = "move/bs_oracle", rev = "11d952488bc50f3a2526549a8cd6d4817ae20cc7" }

# `pyth_lazer` and `wormhole` are already published on Sui. We depend on source
# for typechecking only; `dep-replacements` tells `sui client publish` to link
# against the on-chain packages instead of re-publishing them. Addresses come
# from `contract_manager/src/store/contracts/SuiLazerContracts.json` in the
# pinned pyth-network/pyth-crosschain source revision.
[dep-replacements.testnet]
pyth_lazer = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "lazer/contracts/sui", rev = "f80ff8b1aa2aa9ca17530a9b6294d254f938a5bf", published-at = "0xf5bd2141967507050a91b58de3d95e77c432cd90d1799ee46effc27430a68c21", original-id = "0xf5bd2141967507050a91b58de3d95e77c432cd90d1799ee46effc27430a68c21" }
wormhole = { git = "https://github.com/pyth-network/wormhole.git", subdir = "sui/wormhole", rev = "a596dc27243e6b6dab95539c98b0af9836af2bc2", published-at = "0xd5afd4e456e5451f1ca1e7b3d734ce7a0a3b397811a6cb72a4bd1dfc387839f2", original-id = "0xd5afd4e456e5451f1ca1e7b3d734ce7a0a3b397811a6cb72a4bd1dfc387839f2" }
