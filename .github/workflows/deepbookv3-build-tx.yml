---
name: Build Deepbook TX

# Protocol package-upgrade transactions only. The multisig admin transactions (pools, vaults,
# funds, params, version enable/disable, MVR setup) moved to the deepbook-services repo
# (multisig-txs/ + its Build Multisig TX workflow).

on:
  workflow_dispatch:
    inputs:
      transaction_type:
        description: "select transaction type to create"
        type: choice
        options:
          - Upgrade Protocol
          - Upgrade Protocol and Enable Version
          - Upgrade Margin Protocol
          - Upgrade Margin Protocol and Enable Version
          - Upgrade Vault Protocol
          - Upgrade Vault Protocol and Set Traders
          - Upgrade Predict Protocol
          - Upgrade Propbook Protocol
          - Upgrade Predict Math Protocol
          - Upgrade Predict Orders Protocol
          - Upgrade Sessions Protocol
      sui_tools_image:
        description: "image reference of sui_tools"
        default: "mysten/sui-tools:mainnet"
      rpc:
        description: "RPC url"
        required: true
        default: "https://suins-rpc.mainnet.sui.io:443"
        type: string
      gas_object_id:
        description: "object id to get gas from for multisig transaction"
        required: true
        type: string
        default: "0x538138ff747639efd0c3b0776f802b7a7b111b3a1ccf750bacbfd8c29b6b4110"

jobs:
  deepbook:
    name: deepbook create tx
    runs-on: macos-latest

    steps:
      - name: Selected transaction type
        run: |
          echo ${{ inputs.transaction_type }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      # The macOS runner image ships with aws/tap already tapped. Homebrew's preinstall trust
      # check warns about every untrusted third-party tap, and that warning surfaces as a job
      # annotation. This job installs only `sui` from homebrew-core, so recording trust for
      # the image's own tap on a throwaway runner clears the warning without trusting a tap
      # we install anything from.
      - name: Trust the runner image's preinstalled taps
        run: brew trust aws/tap

      - name: Install Sui using Homebrew
        run: brew install sui

      - name: YAML Setup
        run: |
          sui client --yes new-env --rpc https://fullnode.mainnet.sui.io:443 --alias mainnet-env
          sui client switch --env mainnet-env

      - name: NPM BUILD TX Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node caches automatically from v5 on. This job installs pnpm in a later
          # step, so keep the v4 behavior of touching no package manager at all.
          package-manager-cache: false

      - name: Do a global PNPM install
        run: |
          npm install -g pnpm

      - name: Set up working directory and install dependencies
        run: |
          pnpm install

      - name: Upgrade Protocol
        if: ${{ inputs.transaction_type == 'Upgrade Protocol' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/mainPackageUpgrade.ts

      # Upgrades core and, in the same transaction, enables the new CURRENT_VERSION
      # on the registry and every pool. The UpgradeCap, the core AdminCap and the gas
      # coin must share an owner.
      - name: Upgrade Protocol and Enable Version
        if: ${{ inputs.transaction_type == 'Upgrade Protocol and Enable Version' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/mainPackageUpgradeEnableVersion.ts

      - name: Upgrade Margin Protocol
        if: ${{ inputs.transaction_type == 'Upgrade Margin Protocol' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/marginPackageUpgrade.ts

      # Upgrades margin and, in the same transaction, enables the new MARGIN_VERSION
      # on the MarginRegistry. The margin UpgradeCap, the MarginAdminCap and the gas
      # coin must share an owner, and the build must link the newest core package.
      - name: Upgrade Margin Protocol and Enable Version
        if: ${{ inputs.transaction_type == 'Upgrade Margin Protocol and Enable Version' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/marginPackageUpgradeEnableVersion.ts

      - name: Upgrade Vault Protocol
        if: ${{ inputs.transaction_type == 'Upgrade Vault Protocol' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/vaultPackageUpgrade.ts

      # Upgrades margin_liquidation and, in the same transaction, sets the LiquidationVault's
      # authorized traders to liquidationVaultTraders in scripts/config/constants.ts. The
      # liquidation UpgradeCap, the LiquidationAdminCap and the gas coin must share an owner,
      # and the build must link the newest core and margin packages. That check only sees
      # packages already on chain, so build this after any pending core or margin upgrade
      # has executed and its Published.toml record has merged.
      - name: Upgrade Vault Protocol and Set Traders
        if: ${{ inputs.transaction_type == 'Upgrade Vault Protocol and Set Traders' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/vaultPackageUpgradeSetTraders.ts

      - name: Upgrade Predict Protocol
        if: ${{ inputs.transaction_type == 'Upgrade Predict Protocol' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/predictPackageUpgrade.ts

      # Upgrade only: no version enable or watermark change. Predict, predict_orders and
      # sessions link propbook, so commit its publication record before building them.
      - name: Upgrade Propbook Protocol
        if: ${{ inputs.transaction_type == 'Upgrade Propbook Protocol' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/propbookPackageUpgrade.ts

      # Upgrade only. Predict and predict_orders link predict_math, so commit its
      # publication record before building them.
      - name: Upgrade Predict Math Protocol
        if: ${{ inputs.transaction_type == 'Upgrade Predict Math Protocol' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/predictMathPackageUpgrade.ts

      # Upgrade only. predict_orders links the predict, predict_math and propbook packages
      # their Published.toml files record, so commit those records before building this one.
      - name: Upgrade Predict Orders Protocol
        if: ${{ inputs.transaction_type == 'Upgrade Predict Orders Protocol' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/predictOrdersPackageUpgrade.ts

      # Sessions links against the Predict package that packages/predict/Published.toml
      # records, so upgrade Predict and commit that record before building this one.
      - name: Upgrade Sessions Protocol
        if: ${{ inputs.transaction_type == 'Upgrade Sessions Protocol' }}
        env:
          NODE_ENV: production
          GAS_OBJECT: ${{ inputs.gas_object_id }}
          NETWORK: mainnet
          ORIGIN: gh_action
          RPC_URL: ${{ inputs.rpc }}
        run: |
          cd scripts && pnpm install && pnpm tsx transactions/sessionsPackageUpgrade.ts

      - name: Show Transaction Data (To sign)
        run: |
          cat scripts/tx/tx-data.txt

      - name: Upload Transaction Artifact
        uses: actions/upload-artifact@v7
        with:
          name: transaction-data
          path: scripts/tx
