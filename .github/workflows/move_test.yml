name: Move Test CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      # the parity guard's own source, so a PR that only edits the check still runs it
      - ".github/scripts/**"
      - "packages/**"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SUI_VERSION: testnet-v1.74.0

jobs:
  upgraded-twin-parity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The legacy and upgraded Pyth surfaces must be edited together. Nothing in the
      # compiler ties them, so a parameter added to one side only ships a surface that
      # silently disagrees with itself.
      - name: Check upgraded-twin parity
        run: python3 .github/scripts/check_upgraded_parity.py

  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Sui CLI
        run: |
          curl -fsSL "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-ubuntu-x86_64.tgz" \
            | sudo tar -xz -C /usr/local/bin
          sui --version

      - name: Run Move tests
        run: |
          for dir in packages/*; do
            echo "Running sui move test in $dir"
            sui move test --gas-limit 100000000000 --path "$dir"
          done

  test-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Sui CLI
        run: |
          if [ "$(uname -m)" = "arm64" ]; then SUFFIX="macos-arm64"; else SUFFIX="macos-x86_64"; fi
          curl -fsSL "https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-${SUI_VERSION}-${SUFFIX}.tgz" \
            | tar -xz -C /usr/local/bin
          sui --version

      - name: Run Move tests
        run: |
          for dir in packages/*; do
            echo "Running sui move test in $dir"
            sui move test --gas-limit 100000000000 --path "$dir"
          done
